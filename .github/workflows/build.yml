name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the draft release, for example 0.1.0'
        required: false
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish horsey.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath horsey-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: horsey-win-x64
          path: horsey-win-x64.zip

  draft-release:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horsey-win-x64

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          draft: true
          files: horsey-win-x64.zip
          generate_release_notes: true
